<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#126575" />
    <title>任务工作台</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23126575'/%3E%3Cpath d='M9 9h14v3H9zm0 6h9v3H9zm0 6h14v3H9z' fill='white'/%3E%3C/svg%3E" />
    <script type="module" crossorigin src="/assets/index-DX_F0666.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-C7s9N4ZE.css">
  </head>
  <body>
    <div class="app-shell">
      <aside id="sidebar" class="sidebar" aria-label="任务导航">
        <header class="brand">
          <div class="brand-mark" aria-hidden="true">任</div>
          <div class="brand-copy"><h1>任务工作台</h1><p>清楚安排，专注完成</p></div>
          <button class="icon-button sidebar-close" id="sidebarClose" type="button" title="关闭导航" aria-label="关闭导航"><i data-lucide="x"></i></button>
        </header>

        <section class="sidebar-section sidebar-create">
          <button class="button primary wide" id="globalNewTask" type="button"><i data-lucide="list-plus"></i><span>新建任务</span></button>
        </section>

        <section class="sidebar-section folder-section">
          <div class="section-heading">
            <h2>文件夹</h2>
            <button class="icon-button subtle" id="newFolder" type="button" title="新建根文件夹" aria-label="新建根文件夹"><i data-lucide="folder-plus"></i></button>
          </div>
          <nav id="folderTree" class="folder-tree" aria-label="文件夹树"></nav>
        </section>

        <details class="sidebar-section defaults-section">
          <summary><span><i data-lucide="settings-2"></i>新任务默认值</span></summary>
          <div class="field-grid defaults-grid">
            <label class="field"><span>截止日期</span><select id="defaultDueDate"><option value="today">今天</option><option value="tomorrow">明天</option><option value="next_workday">下个工作日</option><option value="none">不设置</option></select></label>
            <label class="field"><span>优先级</span><select id="defaultPriority"><option value="high">高</option><option value="low">低</option></select></label>
          </div>
        </details>

        <section class="sidebar-section overview-section">
          <div class="section-heading"><h2>任务概览</h2><button class="icon-button subtle" id="resetDemo" type="button" title="重置为示例数据" aria-label="重置为示例数据"><i data-lucide="rotate-ccw"></i></button></div>
          <div class="metric-grid">
            <div class="metric"><span id="metricActive">0</span><small>待办</small></div>
            <div class="metric"><span id="metricCompleted">0</span><small>完成</small></div>
            <div class="metric"><span id="metricDiscarded">0</span><small>不再需要</small></div>
            <div class="metric"><span id="metricDue">0</span><small>今日/逾期</small></div>
          </div>
        </section>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div class="workspace-title">
            <button class="icon-button nav-toggle" id="navToggle" type="button" title="打开导航" aria-label="打开导航"><i data-lucide="panel-left"></i></button>
            <h2 id="workspaceTitle">全部任务</h2>
          </div>
          <div class="topbar-actions">
            <button class="icon-button" id="undoAction" type="button" title="撤销" aria-label="撤销"><i data-lucide="undo-2"></i></button>
            <button class="icon-button" id="redoAction" type="button" title="重做" aria-label="重做"><i data-lucide="redo-2"></i></button>
            <label class="theme-control" title="主题"><span class="sr-only">主题</span><select id="themeSelect" aria-label="主题"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
            <input id="importFile" class="file-input" type="file" accept="application/json,.json" />
            <button class="icon-button" id="importData" type="button" title="导入备份" aria-label="导入备份"><i data-lucide="upload"></i></button>
            <button class="icon-button" id="exportData" type="button" title="导出备份" aria-label="导出备份"><i data-lucide="download"></i></button>
          </div>
        </header>

        <section class="board" aria-label="任务列表">
          <div class="board-toolbar">
            <label class="search-wrap"><i data-lucide="search"></i><span class="sr-only">搜索任务</span><input id="searchInput" type="search" placeholder="搜索标题、说明、标签或状态" /></label>
            <div class="segmented view-segments" role="group" aria-label="任务视图">
              <button class="segment view-segment active" data-view="tree_manual" type="button">任务树</button>
              <button class="segment view-segment" data-view="global_priority" type="button">全局优先级</button>
              <button class="segment view-segment" data-view="global_due_date" type="button">全局日期</button>
              <button class="segment view-segment" data-view="priority_then_due_date" type="button">优先级＋日期</button>
            </div>
          </div>
          <div class="filterbar">
            <div class="segmented status-segments" role="group" aria-label="任务状态筛选">
              <button class="segment status-segment active" data-filter="all" type="button">全部</button>
              <button class="segment status-segment" data-filter="active" type="button">待办</button>
              <button class="segment status-segment" data-filter="completed" type="button">已完成</button>
              <button class="segment status-segment" data-filter="discarded" type="button">不再需要</button>
            </div>
            <p id="dragHint" class="mode-hint">任务树中可拖动待办任务和优先级分界线</p>
          </div>
          <div class="list-head" aria-hidden="true"><span>任务</span><span>优先级</span><span>截止日期</span><span>操作</span></div>
          <div id="taskList" class="task-list" role="listbox" aria-label="任务"></div>
          <div id="emptyState" class="empty-state" hidden><strong>没有匹配的任务</strong><span>调整筛选条件，或新建一项任务。</span></div>
        </section>
      </main>

      <aside id="taskDetail" class="detail-panel" aria-label="任务详情">
        <header class="detail-header"><div><p class="eyebrow">当前选择</p><h2>任务详情</h2></div><button class="icon-button detail-close" id="detailClose" type="button" title="关闭详情" aria-label="关闭详情"><i data-lucide="x"></i></button></header>
        <div id="detailEmpty" class="detail-empty"><strong>选择任务以查看详情</strong></div>
        <form id="detailForm" class="detail-form" autocomplete="off" hidden>
          <div class="detail-fields">
            <div id="detailStatusBadge" class="detail-status"></div>
            <label class="field"><span>任务名称</span><textarea id="detailTitle" rows="3" maxlength="180" required></textarea></label>
            <label class="field"><span>说明</span><textarea id="detailNotes" rows="6" maxlength="2000" placeholder="补充背景、步骤或结果"></textarea></label>
            <div class="field-grid">
              <label class="field"><span>优先级</span><select id="detailPriority"><option value="high">高</option><option value="low">低</option></select></label>
              <label class="field"><span>文件夹</span><select id="detailFolder"></select></label>
            </div>
            <div class="field-grid">
              <label class="field"><span>截止日期</span><input id="detailDueDate" type="date" /></label>
              <label class="field"><span>标签</span><input id="detailTag" type="text" maxlength="24" /></label>
            </div>
            <label class="field"><span>改期原因</span><input id="detailRescheduleReason" type="text" maxlength="120" placeholder="延期时可选填" /></label>
            <dl class="timestamps"><div><dt>创建时间</dt><dd id="detailCreatedAt">-</dd></div><div><dt>更新时间</dt><dd id="detailUpdatedAt">-</dd></div></dl>
            <section id="timelineSection" class="timeline-section" aria-labelledby="timelineTitle" hidden><h3 id="timelineTitle">改期记录</h3><ol id="rescheduleTimeline" class="timeline"></ol></section>
          </div>
          <div class="detail-actions"><button class="button ghost" id="cancelDetail" type="button">取消</button><button class="button primary" type="submit">保存更改</button></div>
        </form>
      </aside>
    </div>

    <dialog id="folderDialog" class="modal"><form id="folderDialogForm" class="modal-card stack"><div class="modal-head"><h2 id="folderDialogTitle">新建文件夹</h2><button class="icon-button" type="button" data-close-dialog aria-label="关闭"><i data-lucide="x"></i></button></div><label class="field"><span>名称</span><input id="folderName" type="text" maxlength="48" required /></label><label class="field"><span>上级文件夹</span><select id="folderParent"></select></label><div class="modal-actions"><button class="button ghost" type="button" data-close-dialog>取消</button><button class="button primary" type="submit">保存</button></div></form></dialog>
    <dialog id="folderDeleteDialog" class="modal"><form class="modal-card stack"><div class="modal-head"><h2>删除非空文件夹</h2><button class="icon-button" id="folderDeleteClose" type="button" aria-label="关闭"><i data-lucide="x"></i></button></div><p id="folderDeleteText" class="confirm-text"></p><div class="choice-actions"><button class="button secondary" id="folderDeleteMove" type="button">内容移到上一级</button><button class="button danger-button" id="folderDeleteBranch" type="button">删除整个分支</button><button class="button ghost" id="folderDeleteCancel" type="button">取消</button></div></form></dialog>
    <dialog id="confirmDialog" class="modal"><form class="modal-card stack"><div class="modal-head"><h2 id="confirmTitle">确认操作</h2><button class="icon-button" id="confirmClose" type="button" aria-label="关闭"><i data-lucide="x"></i></button></div><p id="confirmText" class="confirm-text"></p><div class="modal-actions"><button class="button ghost" id="confirmCancel" type="button">取消</button><button class="button primary" id="confirmOk" type="button">确认</button></div></form></dialog>

    <dialog id="moveDialog" class="modal"><form id="moveDialogForm" class="modal-card stack"><div class="modal-head"><h2>更多任务操作</h2><button class="icon-button" type="button" data-close-dialog aria-label="关闭"><i data-lucide="x"></i></button></div><p id="moveRestriction" class="field-note" hidden>逾期任务改期后可调整文件夹、优先级和顺序。</p><label class="field"><span>目标文件夹</span><select id="moveFolder"></select></label><label class="field"><span>优先级</span><select id="movePriority"><option value="high">高</option><option value="low">低</option></select></label><div class="move-step-actions"><button class="button secondary" id="movePrevious" type="button">移到上一项</button><button class="button secondary" id="moveNext" type="button">移到下一项</button></div><button class="button danger-button" id="moveDelete" type="button"><i data-lucide="trash-2"></i><span>删除任务</span></button><div class="modal-actions"><button class="button ghost" type="button" data-close-dialog>取消</button><button class="button primary" id="moveSubmit" type="submit">移动到末尾</button></div></form></dialog>

    <dialog id="rescheduleDialog" class="modal"><form id="rescheduleForm" class="modal-card stack"><div class="modal-head"><h2>重新安排截止日期</h2><button class="icon-button" type="button" data-close-dialog aria-label="关闭"><i data-lucide="x"></i></button></div><div class="preset-grid" role="group" aria-label="日期快捷选项"><button class="button secondary" type="button" data-reschedule-days="1">明天</button><button class="button secondary" type="button" data-reschedule-days="3">3 天后</button><button class="button secondary" type="button" data-reschedule-days="7">7 天后</button></div><label class="field"><span>新日期</span><input id="rescheduleDate" type="date" required /></label><label class="field"><span>原因</span><input id="rescheduleReason" type="text" maxlength="120" placeholder="可选" /></label><div class="modal-actions"><button class="button ghost" type="button" data-close-dialog>取消</button><button class="button primary" type="submit">确认改期</button></div></form></dialog>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <div id="liveRegion" class="sr-only" role="status" aria-live="assertive" aria-atomic="true"></div>
  </body>
</html>
