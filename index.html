<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>计划记录工作台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="计划录入">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">计</div>
          <div>
            <h1>计划记录工作台</h1>
            <p>记录要做的事，沉淀每轮迭代。</p>
          </div>
        </div>

        <form id="taskForm" class="panel stack" autocomplete="off">
          <div class="panel-heading">
            <h2>新增计划</h2>
            <span class="hint">Ctrl + Enter 保存</span>
          </div>

          <label class="field">
            <span>要做什么</span>
            <textarea id="taskTitle" rows="4" maxlength="180" placeholder="例如：整理本周产品优化清单" required></textarea>
          </label>

          <div class="field-grid">
            <label class="field">
              <span>优先级</span>
              <select id="taskPriority">
                <option value="高">高</option>
                <option value="中" selected>中</option>
                <option value="低">低</option>
              </select>
            </label>
            <label class="field">
              <span>日期</span>
              <input id="taskDate" type="date" />
            </label>
          </div>

          <label class="field">
            <span>标签</span>
            <input id="taskTag" type="text" maxlength="24" placeholder="工作 / 学习 / 生活" />
          </label>

          <div class="form-actions">
            <button class="button primary" type="submit" title="保存计划">
              <span aria-hidden="true">＋</span>
              保存计划
            </button>
            <button class="button ghost" id="clearForm" type="button" title="清空输入">
              <span aria-hidden="true">×</span>
              清空
            </button>
          </div>
        </form>

        <section class="panel stack">
          <div class="panel-heading">
            <h2>今日概览</h2>
            <button class="icon-button" id="resetDemo" type="button" title="重置示例数据" aria-label="重置示例数据">↺</button>
          </div>
          <div class="metric-grid">
            <div class="metric">
              <span id="metricOpen">0</span>
              <small>待办</small>
            </div>
            <div class="metric">
              <span id="metricDone">0</span>
              <small>完成</small>
            </div>
            <div class="metric">
              <span id="metricHigh">0</span>
              <small>高优先级</small>
            </div>
          </div>
        </section>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">当前迭代</p>
            <h2 id="currentIterationTitle">第 1 轮：基础可用版</h2>
          </div>
          <div class="topbar-actions">
            <button class="button secondary" id="exportData" type="button" title="导出数据">
              <span aria-hidden="true">⇩</span>
              导出
            </button>
            <button class="button secondary" id="completeIteration" type="button" title="完成本轮迭代">
              <span aria-hidden="true">✓</span>
              完成本轮
            </button>
          </div>
        </header>

        <section class="board">
          <div class="board-toolbar">
            <div class="search-wrap">
              <span aria-hidden="true">⌕</span>
              <input id="searchInput" type="search" placeholder="搜索计划、标签或备注" />
            </div>
            <div class="segmented" role="tablist" aria-label="任务状态筛选">
              <button class="segment active" data-filter="all" type="button">全部</button>
              <button class="segment" data-filter="open" type="button">待办</button>
              <button class="segment" data-filter="done" type="button">完成</button>
            </div>
          </div>

          <div class="list-head" aria-hidden="true">
            <span>计划</span>
            <span>优先级</span>
            <span>日期</span>
            <span>操作</span>
          </div>

          <div id="taskList" class="task-list" aria-live="polite"></div>
          <div id="emptyState" class="empty-state" hidden>
            <strong>没有匹配的计划</strong>
            <span>换个筛选条件，或在左侧记录一个新的事项。</span>
          </div>
        </section>
      </main>

      <aside class="right-rail" aria-label="迭代与反馈">
        <section class="panel stack">
          <div class="panel-heading">
            <h2>本轮完成记录</h2>
            <button class="icon-button" id="addDoneItem" type="button" title="添加完成项" aria-label="添加完成项">＋</button>
          </div>
          <div id="doneLog" class="check-list"></div>
        </section>

        <section class="panel stack">
          <div class="panel-heading">
            <h2>下一轮建议</h2>
            <button class="icon-button" id="addNextItem" type="button" title="添加下一轮目标" aria-label="添加下一轮目标">＋</button>
          </div>
          <div id="nextPlan" class="check-list"></div>
        </section>

        <section class="panel stack">
          <div class="panel-heading">
            <h2>反馈输入</h2>
            <span class="hint">用于生成下一轮</span>
          </div>
          <label class="field">
            <span>你的建议</span>
            <textarea id="feedbackInput" rows="5" maxlength="400" placeholder="例如：希望增加提醒、分类统计或多设备同步"></textarea>
          </label>
          <button class="button primary wide" id="applyFeedback" type="button" title="根据反馈生成下一轮计划">
            <span aria-hidden="true">↪</span>
            生成下一轮计划
          </button>
        </section>

        <section class="panel stack">
          <div class="panel-heading">
            <h2>迭代历史</h2>
            <span id="iterationCount" class="hint">0 条</span>
          </div>
          <div id="iterationHistory" class="history"></div>
        </section>
      </aside>
    </div>

    <template id="taskTemplate">
      <article class="task-item">
        <label class="task-check">
          <input type="checkbox" />
          <span></span>
        </label>
        <div class="task-main">
          <strong></strong>
          <small></small>
        </div>
        <span class="priority"></span>
        <time></time>
        <div class="task-actions">
          <button class="icon-button" data-action="edit" type="button" title="编辑计划" aria-label="编辑计划">✎</button>
          <button class="icon-button danger" data-action="delete" type="button" title="删除计划" aria-label="删除计划">×</button>
        </div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
