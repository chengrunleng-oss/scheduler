<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#176c7d" />
    <title>任务记录工作台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="任务录入">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">任</div>
          <div>
            <h1>任务记录工作台</h1>
            <p>快速记录要做的事，定期沉淀改进。</p>
          </div>
        </div>

        <form id="taskForm" class="panel stack" autocomplete="off">
          <div class="panel-heading">
            <h2>记录任务</h2>
            <span class="hint">Ctrl + Enter 保存</span>
          </div>

          <label class="field">
            <span>任务内容</span>
            <textarea id="taskTitle" rows="4" maxlength="180" placeholder="例如：整理本周产品优化清单" required></textarea>
          </label>

          <div class="field-grid">
            <label class="field">
              <span>优先级</span>
              <select id="taskPriority">
                <option value="high">高</option>
                <option value="medium" selected>中</option>
                <option value="low">低</option>
              </select>
            </label>
            <label class="field">
              <span>截止日期</span>
              <input id="taskDueDate" type="date" />
            </label>
          </div>

          <label class="field">
            <span>标签</span>
            <input id="taskTag" type="text" maxlength="24" placeholder="工作 / 学习 / 生活" />
          </label>

          <div class="form-actions">
            <button class="button primary" type="submit" title="保存任务">
              <span aria-hidden="true">＋</span>
              保存任务
            </button>
            <button class="button ghost" id="clearForm" type="button" title="清空输入">
              <span aria-hidden="true">×</span>
              清空
            </button>
          </div>
        </form>

        <section class="panel stack">
          <div class="panel-heading">
            <h2>任务概览</h2>
            <button class="icon-button" id="resetDemo" type="button" title="重置示例数据" aria-label="重置示例数据">↺</button>
          </div>
          <div class="metric-grid">
            <div class="metric">
              <span id="metricOpen">0</span>
              <small>待办</small>
            </div>
            <div class="metric">
              <span id="metricDone">0</span>
              <small>完成</small>
            </div>
            <div class="metric">
              <span id="metricDue">0</span>
              <small>到期/逾期</small>
            </div>
          </div>
        </section>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">当前工作区</p>
            <h2 id="currentIterationTitle">任务看板</h2>
          </div>
          <div class="topbar-actions">
            <button class="icon-button" id="undoAction" type="button" title="撤销" aria-label="撤销">↶</button>
            <button class="icon-button" id="redoAction" type="button" title="重做" aria-label="重做">↷</button>
            <label class="theme-control" title="主题">
              <span class="sr-only">主题</span>
              <select id="themeSelect" aria-label="主题">
                <option value="system">跟随系统</option>
                <option value="light">浅色</option>
                <option value="dark">深色</option>
              </select>
            </label>
            <input id="importFile" class="file-input" type="file" accept="application/json,.json" />
            <button class="button secondary" id="importData" type="button" title="导入备份">
              <span aria-hidden="true">⇧</span>
              导入
            </button>
            <button class="button secondary" id="exportData" type="button" title="导出备份">
              <span aria-hidden="true">⇩</span>
              导出
            </button>
            <button class="button secondary" id="completeIteration" type="button" title="归档当前改进轮次">
              <span aria-hidden="true">✓</span>
              归档本轮
            </button>
          </div>
        </header>

        <section class="board">
          <div class="board-toolbar">
            <div class="search-wrap">
              <span aria-hidden="true">⌕</span>
              <input id="searchInput" type="search" placeholder="搜索任务、标签或优先级" />
            </div>
            <div class="segmented" role="tablist" aria-label="任务状态筛选">
              <button class="segment active" data-filter="all" type="button">全部</button>
              <button class="segment" data-filter="open" type="button">待办</button>
              <button class="segment" data-filter="done" type="button">完成</button>
            </div>
          </div>

          <div class="list-head" aria-hidden="true">
            <span>任务</span>
            <span>优先级</span>
            <span>截止</span>
            <span>操作</span>
          </div>

          <div id="taskList" class="task-list" aria-live="polite"></div>
          <div id="emptyState" class="empty-state" hidden>
            <strong>没有匹配的任务</strong>
            <span>换个筛选条件，或在左侧记录一个新的任务。</span>
          </div>
        </section>
      </main>

      <aside class="right-rail" aria-label="改进与反馈">
        <section class="panel stack">
          <div class="panel-heading">
            <h2>改进记录</h2>
            <button class="icon-button" id="addDoneItem" type="button" title="添加完成项" aria-label="添加完成项">＋</button>
          </div>
          <div id="doneLog" class="check-list"></div>
        </section>

        <section class="panel stack">
          <div class="panel-heading">
            <h2>下一轮改进项</h2>
            <button class="icon-button" id="addNextItem" type="button" title="添加改进项" aria-label="添加改进项">＋</button>
          </div>
          <div id="nextPlan" class="check-list"></div>
        </section>

        <section class="panel stack">
          <div class="panel-heading">
            <h2>产品反馈</h2>
            <span class="hint">整理为改进项</span>
          </div>
          <label class="field">
            <span>你的建议</span>
            <textarea id="feedbackInput" rows="5" maxlength="400" placeholder="例如：希望增加提醒、分类统计或多设备同步"></textarea>
          </label>
          <button class="button primary wide" id="applyFeedback" type="button" title="整理反馈为下一轮改进项">
            <span aria-hidden="true">↪</span>
            整理为改进项
          </button>
        </section>

        <section class="panel stack">
          <div class="panel-heading">
            <h2>开发历史</h2>
            <span id="iterationCount" class="hint">0 条</span>
          </div>
          <div id="iterationHistory" class="history"></div>
        </section>
      </aside>
    </div>

    <template id="taskTemplate">
      <article class="task-item">
        <label class="task-check">
          <input type="checkbox" />
          <span class="sr-only">切换完成状态</span>
        </label>
        <div class="task-main">
          <strong></strong>
          <small></small>
        </div>
        <span class="priority"></span>
        <time></time>
        <div class="task-actions">
          <button class="icon-button" data-action="edit" type="button" title="编辑任务" aria-label="编辑任务">✎</button>
          <button class="icon-button danger" data-action="delete" type="button" title="删除任务" aria-label="删除任务">×</button>
        </div>
      </article>
    </template>

    <dialog id="taskDialog" class="modal">
      <form id="taskDialogForm" class="modal-card stack">
        <div class="modal-head">
          <h2 id="taskDialogTitle">编辑任务</h2>
          <button class="icon-button" type="button" data-close-dialog aria-label="关闭">×</button>
        </div>
        <label class="field">
          <span>任务内容</span>
          <textarea id="dialogTaskTitle" rows="4" maxlength="180" required></textarea>
        </label>
        <div class="field-grid">
          <label class="field">
            <span>优先级</span>
            <select id="dialogTaskPriority">
              <option value="high">高</option>
              <option value="medium">中</option>
              <option value="low">低</option>
            </select>
          </label>
          <label class="field">
            <span>截止日期</span>
            <input id="dialogTaskDueDate" type="date" />
          </label>
        </div>
        <label class="field">
          <span>标签</span>
          <input id="dialogTaskTag" type="text" maxlength="24" />
        </label>
        <div class="modal-actions">
          <button class="button ghost" type="button" data-close-dialog>取消</button>
          <button class="button primary" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <dialog id="itemDialog" class="modal">
      <form id="itemDialogForm" class="modal-card stack">
        <div class="modal-head">
          <h2 id="itemDialogTitle">添加改进项</h2>
          <button class="icon-button" type="button" data-close-dialog aria-label="关闭">×</button>
        </div>
        <label class="field">
          <span id="itemDialogLabel">内容</span>
          <textarea id="itemDialogText" rows="4" maxlength="220" required></textarea>
        </label>
        <div class="modal-actions">
          <button class="button ghost" type="button" data-close-dialog>取消</button>
          <button class="button primary" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <dialog id="confirmDialog" class="modal">
      <form class="modal-card stack">
        <div class="modal-head">
          <h2 id="confirmTitle">确认操作</h2>
          <button class="icon-button" id="confirmClose" type="button" aria-label="关闭">×</button>
        </div>
        <p id="confirmText" class="confirm-text"></p>
        <div class="modal-actions">
          <button class="button ghost" id="confirmCancel" type="button">取消</button>
          <button class="button primary" id="confirmOk" type="button">确认</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script src="dist/app.js"></script>
  </body>
</html>
